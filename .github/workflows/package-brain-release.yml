name: Package Brain Release

# Build Get Brain artifacts on Fedora: .rpm (primary) + .tar.gz (fallback).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-native/scripts/package-brain-release.sh"
      - "desktop-native/scripts/package-brain-rpm.sh"
      - "desktop-native/scripts/customer-install.sh"
      - "desktop-native/scripts/brain-launcher.sh"
      - "desktop-native/scripts/cleanup-user-brain-launcher.sh"
      - "desktop-native/scripts/bundle-centurion-core.sh"
      - "desktop-native/scripts/stage-mission-deck.sh"
      - "desktop-native/scripts/stage-whatsapp-bridge.sh"
      - "scripts/whatsapp-bridge/**"
      - "web-dashboard/**"
      - "desktop-native/centurion-install-brain/**"
      - "desktop-native/centurion-desktop/**"
      - "desktop-native/resources/**"
      - "desktop-native/Cargo.toml"
      - "centurion_cli/__init__.py"
      - ".github/workflows/package-brain-release.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install native build dependencies
        run: >-
          dnf install -y
          cargo rust gcc gcc-c++ binutils
          pkgconf-pkg-config gtk4-devel libadwaita-devel vte291-gtk4-devel
          webkitgtk6.0-devel libsoup3-devel
          rpm-build rpmdevtools
          python3 python3-pip python3-devel
          nodejs npm

      - name: Build Brain binaries (release)
        working-directory: desktop-native
        run: >-
          cargo build --release
          -p centurion-desktop
          -p centurion-remote
          -p centurion-install-brain

      - name: Build Mission Deck (Focus tab)
        working-directory: web-dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -d dist

      - name: Prefetch WhatsApp bridge npm deps
        working-directory: scripts/whatsapp-bridge
        run: |
          npm ci --omit=dev --no-audit --no-fund
          test -d node_modules

      - name: Package Smooth Transfer archive (.tar.gz)
        run: desktop-native/scripts/package-brain-release.sh

      - name: Package Fedora installer (.rpm)
        run: desktop-native/scripts/package-brain-rpm.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: centurion-brain-linux-x86_64
          path: |
            desktop-native/dist/centurion-brain-*.rpm
            desktop-native/dist/centurion-brain-*.rpm.sha256
            desktop-native/dist/centurion-brain-*-linux-x86_64.tar.gz
            desktop-native/dist/centurion-brain-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

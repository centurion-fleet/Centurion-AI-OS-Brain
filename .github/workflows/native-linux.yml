name: Native Linux

on:
  pull_request:
    paths:
      - "brain/**"
      - "centurion_cli/remote_bridge.py"
      - "tests/centurion_cli/test_remote_bridge.py"
      - ".github/workflows/native-linux.yml"
  push:
    branches: [main]
    paths:
      - "brain/**"
      - "centurion_cli/remote_bridge.py"
      - "tests/centurion_cli/test_remote_bridge.py"
      - ".github/workflows/native-linux.yml"

permissions:
  contents: read

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install native build dependencies
        run: >-
          dnf install -y
          cargo rust rustfmt clippy gcc gcc-c++
          pkgconf-pkg-config gtk4-devel libadwaita-devel vte291-gtk4-devel

      - name: Check formatting
        working-directory: brain
        run: cargo fmt --all -- --check

      - name: Run native tests
        working-directory: brain
        run: cargo test --workspace --locked

      - name: Run Clippy
        working-directory: brain
        # Protocol crates stay strict. The GTK app ships against Fedora libadwaita APIs
        # that still emit deprecated/pedantic noise; allow those there only.
        run: |
          cargo clippy -p centurion-common -p centurion-remote --all-targets --locked -- -D warnings
          cargo clippy -p centurion-desktop --all-targets --locked -- \
            -D warnings -A deprecated \
            -A clippy::pedantic \
            -A clippy::too_many_lines \
            -A clippy::map_unwrap_or \
            -A clippy::match_wildcard_for_single_variants \
            -A clippy::needless_pass_by_value \
            -A clippy::assigning_clones \
            -A clippy::redundant_closure_for_method_calls \
            -A clippy::match_same_arms \
            -A clippy::needless_borrow \
            -A clippy::needless_borrows_for_generic_args \
            -A dead_code \
            -A unused_imports

      - name: Install Python test environment
        run: |
          dnf install -y python3 python3-pip python3-devel openssl-devel libffi-devel curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.11
          uv venv .venv --python 3.11
          # Remote bridge tests only need the editable package + pytest toolchain.
          uv pip install -e ".[dev]"

      - name: Run Python remote bridge tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/run_tests.sh tests/centurion_cli/test_remote_bridge.py

      - name: Run loopback smoke script
        run: brain/linux/scripts/e2e-smoke.sh

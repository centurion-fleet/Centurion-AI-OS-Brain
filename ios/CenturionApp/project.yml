name: CenturionApp
options:
  bundleIdPrefix: com.centurion
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  CenturionApp:
    type: application
    platform: iOS
    sources:
      - path: CenturionApp.swift
      - path: ContentView.swift
      - path: Views
      - path: Models
      - path: Services
      - path: Crypto
      - path: Utils
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centurion.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Centurion needs local network access to discover your Centurion on the local network via Bonjour."
        NSBonjourServices:
          - _centurion._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false

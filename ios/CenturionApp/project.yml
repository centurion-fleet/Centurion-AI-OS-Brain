name: CenturionApp
options:
  bundleIdPrefix: com.centurion
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: J6DY26ZGL4
    CODE_SIGN_STYLE: Automatic

packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    exactVersion: 0.11.0

targets:
  CenturionApp:
    type: application
    platform: iOS
    sources:
      - path: Assets.xcassets
      - path: CenturionApp.swift
      - path: ContentView.swift
      - path: Views
      - path: Models
      - path: Services
      - path: Crypto
      - path: Utils
    dependencies:
      - package: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centurion.ios
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "2"
    info:
      path: Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: AppMark
        UIApplicationSupportsAllInterfaceOrientations: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Centurion needs local network access to find your Centurion on your Wi‑Fi."
        NSBonjourServices:
          - _centurion._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false

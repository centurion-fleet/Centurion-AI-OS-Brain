name: CenturionApp
options:
  bundleIdPrefix: com.centurion
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  CenturionApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "Package.swift"
          - "project.yml"
          - "README.md"
    info:
      path: Info.plist
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.centurion.iphone
    dependencies:
      - framework: Sodium  # from SPM

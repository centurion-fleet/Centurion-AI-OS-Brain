[workspace]
members = [
    "service/centurion-common",
    "service/centurion-remote",
    "linux/centurion-desktop",
    "linux/centurion-install-brain",
]
resolver = "2"

[workspace.package]
version = "7.0.13"
edition = "2024"
# PROPRIETARY — see the LICENSE file at the repo root. SPDX has no stock
# identifier for proprietary software; LicenseRef-Proprietary is the
# correct form. Do not revert to an OSI identifier.
license = "LicenseRef-Proprietary"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[package]
name = "centurion-desktop"
version = "5.2.1"
description = "Centurion OS Desktop - Native Linux App"
authors = ["Centurion AI Ltd"]
edition = "2021"

[lib]
name = "centurion_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

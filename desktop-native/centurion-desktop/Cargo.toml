[package]
name = "centurion-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
centurion-common = { path = "../centurion-common" }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.22.8"
glib = "0.22.8"
gtk4 = { version = "0.11.3", features = ["v4_20"] }
libadwaita = { version = "0.9.2", features = ["v1_8", "gtk_v4_20"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
webkit6 = { version = "0.6.1", features = ["v2_44"] }
javascriptcore6 = "0.6"
ureq = { version = "2.12.1", features = ["json"] }
uuid = { version = "1.23.4", features = ["v4"] }

name: CenturionApp
options:
  bundleIdPrefix: com.centurion
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: J6DY26ZGL4
    CODE_SIGN_STYLE: Automatic
    # Project-wide so Xcode General / TestFlight never fall back to a stale ASC train.
    MARKETING_VERSION: "5.3.0"
    CURRENT_PROJECT_VERSION: "45"

packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    exactVersion: 0.11.0

targets:
  CenturionApp:
    type: application
    platform: iOS
    sources:
      - path: Assets.xcassets
      - path: LaunchScreen.storyboard
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: CenturionApp.swift
      - path: ContentView.swift
      - path: Views
      - path: Models
      - path: Services
      - path: Crypto
      - path: Utils
    dependencies:
      - package: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centurion.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "5.3.0"
        CURRENT_PROJECT_VERSION: "45"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sovereign AI Remote
        # Literals so ASC/TestFlight + Xcode General show 5.3.0 (not a stale 5.0.1 train).
        CFBundleShortVersionString: "5.3.0"
        CFBundleVersion: "45"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsAllInterfaceOrientations: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Sovereign AI Remote needs local network access to find your Sovereign on your Wi‑Fi."
        NSCameraUsageDescription: "Sovereign AI Remote uses the camera only to scan the pairing QR code shown on your Centurion."
        NSContactsUsageDescription: "Sovereign AI Remote can fill a friend’s name, email, and phone when you refer them for the Family Beneficiary program. Contacts stay on your iPhone unless you submit a referral to your Sovereign."
        NSBonjourServices:
          - _centurion._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false

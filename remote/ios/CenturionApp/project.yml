name: CenturionApp
options:
  bundleIdPrefix: com.centurion
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: J6DY26ZGL4
    CODE_SIGN_STYLE: Automatic
    # Project-wide so Xcode General / TestFlight never fall back to a stale ASC train.
    MARKETING_VERSION: "5.5.0"
    CURRENT_PROJECT_VERSION: "75"

packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    exactVersion: 0.11.0

targets:
  CenturionApp:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
      - iPadOS
    sources:
      - path: Assets.xcassets
      - path: LaunchScreen.storyboard
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: CenturionApp.swift
      - path: ContentView.swift
      - path: Views
      - path: Models
      - path: Services
      - path: Crypto
      - path: Utils
      - path: Signum
    dependencies:
      - package: Sodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.centurion.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "5.5.0"
        CURRENT_PROJECT_VERSION: "75"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_IPHONE: YES
        SUPPORTS_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sovereign AI Remote
        # Drive both from the build settings. Hardcoding these is what let every
        # archive from 68 onward report CFBundleVersion 67 and made TestFlight
        # refuse duplicate build numbers.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Sovereign AI Remote needs local network access to find your Sovereign on your Wi‑Fi."
        NSCameraUsageDescription: "Sovereign AI Remote uses the camera only to scan the pairing QR code shown on your Centurion."
        NSContactsUsageDescription: "Sovereign AI Remote can fill a friend’s name, email, and phone when you refer them for the Family Beneficiary program. Contacts stay on your iPhone unless you submit a referral to your Sovereign."
        NSBonjourServices:
          - _centurion._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
